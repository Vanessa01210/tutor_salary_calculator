<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酥酥老師調課追蹤板</title>
  
  <!-- 引入繁體中文圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    /* 強制全面套用繁體中文圓體，解決「酥」字缺字變宋體的問題 */
    body, * {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif !important;
    }

    /* 專屬日系手繪風 CSS */
    body {
      background-color: #fffaf0; 
      color: #5c4a40; 
    }
    .hand-drawn-box {
      background: #ffffff;
      border: 3px solid #5c4a40;
      border-radius: 16px 24px 16px 24px; 
      box-shadow: 6px 6px 0px #e6d5c3;
      transition: all 0.3s ease;
    }
    .hand-drawn-box:hover {
      box-shadow: 8px 8px 0px #d4baa0;
    }
    .hand-drawn-btn {
      background: #f4e3c5;
      border: 2px dashed #5c4a40;
      border-radius: 12px 20px 12px 20px;
      color: #5c4a40;
      font-weight: bold;
      box-shadow: 3px 3px 0px #5c4a40;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .hand-drawn-btn:active {
      box-shadow: 0px 0px 0px #5c4a40;
      transform: translate(3px, 3px);
    }
    .hand-drawn-input {
      border: 2px solid #d4baa0;
      border-radius: 10px 14px 10px 14px;
      background: #fffdf9;
    }
    .hand-drawn-input:focus {
      outline: none;
      border-color: #5c4a40;
      background: #ffffff;
    }
    .tag-pending { background: #ffe4e1; border: 2px solid #e5989b; color: #b56576; }
    .tag-scheduled { background: #fff3cd; border: 2px solid #f4a261; color: #d08c60; }
    .tag-completed { background: #d8f3dc; border: 2px solid #74c69d; color: #40916c; }
  </style>
</head>
<body>
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Plus = ({className}) => <Icon className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
    const Trash = ({className}) => <Icon className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
    const Clock = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon>;
    const Alert = ({className}) => <Icon className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></Icon>;

    const generateId = () => `id-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;

    function App() {
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('susuMakeupRecords');
        if (saved) return JSON.parse(saved);
        return [{ id: generateId(), student: '小明', subject: '三年級數學', date: '2026-05-15', hours: 1.5, notice24h: true, status: '待補課', makeupDate: '' }];
      });

      useEffect(() => {
        localStorage.setItem('susuMakeupRecords', JSON.stringify(records));
      }, [records]);

      const leaveCounts = {};
      records.forEach(r => {
        const name = r.student.trim();
        if (name) {
          leaveCounts[name] = (leaveCounts[name] || 0) + 1;
        }
      });

      const addRecord = () => {
        setRecords([{ 
          id: generateId(), 
          student: '', 
          subject: '',
          date: '', 
          hours: '', 
          notice24h: true, 
          status: '待補課', 
          makeupDate: '' 
        }, ...records]);
      };

      const removeRecord = (id) => {
        if(window.confirm('確定要刪除這筆請假紀錄嗎？')) {
          setRecords(records.filter(record => record.id !== id));
        }
      };

      const updateRecord = (id, field, value) => {
        setRecords(records.map(record => record.id === id ? { ...record, [field]: value } : record));
      };

      const clearAll = () => {
        if(window.confirm('準備開始新的一期了嗎？這將會清空所有調課紀錄與額度喔！')) {
          setRecords([]);
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto">
          
          <header className="mb-8 flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
            <div>
              <h1 className="text-3xl md:text-4xl font-black mb-2 flex items-center gap-3">
                <span className="text-[#e5989b]">✿</span> 酥酥老師調課追蹤板
              </h1>
              <p className="text-[#8c7a6b] font-bold tracking-widest pl-10">你的專屬教務手帳</p>
            </div>
            
            <div className="hand-drawn-box p-4 bg-[#fffdf9] w-full md:w-auto relative overflow-hidden">
              <div className="absolute top-0 left-0 w-2 h-full bg-[#d4baa0]"></div>
              <h2 className="font-bold flex items-center gap-2 mb-2 text-[#b56576]">
                <Alert className="w-5 h-5" /> 酥酥老師請假公約
              </h2>
              <ul className="text-sm font-bold text-[#8c7a6b] space-y-1 pl-1">
                <li>✨ 每期每位學生提供 <span className="text-[#e5989b] text-base">2</span> 次調課機會</li>
                <li>✨ 若需請假，請務必於 <span className="text-[#e5989b] text-base">24 小時前</span> 告知</li>
                <li>✨ 補課需安排與原課程 <span className="text-[#e5989b] text-base">相同時數</span> (不拆碎)</li>
              </ul>
            </div>
          </header>

          {Object.keys(leaveCounts).length > 0 && (
            <section className="mb-10">
              <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Clock className="w-6 h-6"/> 本期已請假次數 (上限2次)</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {Object.entries(leaveCounts).map(([student, count]) => {
                  let barColor = "bg-[#74c69d]"; 
                  let textColor = "text-[#40916c]";
                  let status = "狀態良好";
                  
                  if (count === 2) {
                    barColor = "bg-[#f4a261]"; 
                    textColor = "text-[#d08c60]";
                    status = "額度用盡";
                  } else if (count > 2) {
                    barColor = "bg-[#e5989b]"; 
                    textColor = "text-[#b56576]";
                    status = "⚠️ 超出額度";
                  }

                  return (
                    <div key={student} className="hand-drawn-box p-4 flex flex-col items-center justify-center text-center gap-2">
                      <span className="font-black text-lg">{student}</span>
                      <div className="flex gap-1 w-full justify-center">
                        <div className={`h-3 w-8 rounded-full border-2 border-[#5c4a40] ${count >= 1 ? barColor : 'bg-transparent'}`}></div>
                        <div className={`h-3 w-8 rounded-full border-2 border-[#5c4a40] ${count >= 2 ? barColor : 'bg-transparent'}`}></div>
                      </div>
                      <span className={`text-xs font-bold ${textColor}`}>{count} / 2 - {status}</span>
                    </div>
                  );
                })}
              </div>
            </section>
          )}

          <div className="flex justify-between items-center mb-6">
            <h2 className="text-xl font-bold flex items-center gap-2"><span className="text-[#d4baa0]">✏️</span> 請假與補課紀錄</h2>
            <button onClick={addRecord} className="hand-drawn-btn px-6 py-2 flex items-center gap-2">
              <Plus className="w-5 h-5" /> 登記請假
            </button>
          </div>

          <div className="space-y-5">
            {records.length === 0 ? (
              <div className="text-center py-12 text-[#b0a090] font-bold border-4 border-dashed border-[#e6d5c3] rounded-3xl">
                目前沒有任何請假紀錄，大家都全勤喔！🎉
              </div>
            ) : (
              records.map(record => (
                <div key={record.id} className="hand-drawn-box p-5 md:p-6 relative group">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                    
                    <div className="md:col-span-3 space-y-2">
                      <div>
                        <label className="text-xs font-bold text-[#b0a090] block mb-1">學生姓名</label>
                        <input type="text" value={record.student} onChange={(e) => updateRecord(record.id, 'student', e.target.value)} placeholder="例：小明" className="hand-drawn-input w-full px-3 py-2 font-bold text-lg" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-[#b0a090] block mb-1">請假科目</label>
                        <input type="text" value={record.subject} onChange={(e) => updateRecord(record.id, 'subject', e.target.value)} placeholder="例：中文標點符號" className="hand-drawn-input w-full px-3 py-1.5 text-sm" />
                      </div>
                    </div>

                    <div className="md:col-span-3 space-y-2 md:border-l-2 md:border-dashed md:border-[#e6d5c3] md:pl-4">
                      <div>
                        <label className="text-xs font-bold text-[#b0a090] block mb-1">原上課日期</label>
                        <input type="date" value={record.date} onChange={(e) => updateRecord(record.id, 'date', e.target.value)} className="hand-drawn-input w-full px-3 py-2 font-bold" />
                      </div>
                      <div className="flex items-center gap-2">
                        <label className="text-xs font-bold text-[#b0a090]">原時數</label>
                        <input type="number" step="0.5" min="0" value={record.hours} onChange={(e) => updateRecord(record.id, 'hours', e.target.value)} placeholder="1.5" className="hand-drawn-input w-20 px-2 py-1 text-center font-bold" />
                        <span className="text-xs font-bold text-[#b0a090]">小時</span>
                      </div>
                    </div>

                    <div className="md:col-span-2 flex flex-col justify-center items-start md:items-center md:border-l-2 md:border-dashed md:border-[#e6d5c3] md:px-4">
                      <label className="text-xs font-bold text-[#b0a090] block mb-2">通知時間</label>
                      <button 
                        onClick={() => updateRecord(record.id, 'notice24h', !record.notice24h)}
                        className={`px-3 py-1.5 rounded-xl border-2 font-bold text-sm transition-all ${record.notice24h ? 'bg-[#d8f3dc] border-[#74c69d] text-[#40916c]' : 'bg-[#ffe4e1] border-[#e5989b] text-[#b56576]'}`}
                      >
                        {record.notice24h ? '✅ 24hr前告知' : '⚠️ 臨時請假'}
                      </button>
                    </div>

                    <div className="md:col-span-3 space-y-2 md:border-l-2 md:border-dashed md:border-[#e6d5c3] md:pl-4">
                      <label className="text-xs font-bold text-[#b0a090] block mb-1">補課狀態</label>
                      <select 
                        value={record.status} 
                        onChange={(e) => updateRecord(record.id, 'status', e.target.value)}
                        className={`w-full px-3 py-2 rounded-xl border-2 font-bold cursor-pointer outline-none appearance-none text-center ${record.status === '待補課' ? 'tag-pending' : record.status === '已排定' ? 'tag-scheduled' : 'tag-completed'}`}
                      >
                        <option value="待補課">🔴 待補課 (尚未安排)</option>
                        <option value="已排定">🟡 已排定補課時間</option>
                        <option value="已完成">🟢 補課已完成！</option>
                      </select>
                      
                      {record.status !== '待補課' && (
                        <div className="animate-fade-in">
                          <input type="text" value={record.makeupDate} onChange={(e) => updateRecord(record.id, 'makeupDate', e.target.value)} placeholder="例：改至 5/20 晚上" className="hand-drawn-input w-full px-3 py-1.5 text-sm text-center bg-transparent mt-1" />
                        </div>
                      )}
                    </div>

                    <div className="md:col-span-1 flex justify-end">
                      <button onClick={() => removeRecord(record.id)} className="p-2 rounded-xl text-[#e5989b] hover:bg-[#ffe4e1] border-2 border-transparent hover:border-[#e5989b] transition-all">
                        <Trash className="w-5 h-5" />
                      </button>
                    </div>

                  </div>
                </div>
              ))
            )}
          </div>

          <div className="mt-12 text-center">
            <button onClick={clearAll} className="text-sm font-bold text-[#b0a090] hover:text-[#b56576] underline underline-offset-4 transition-colors">
              🧹 新的一期開始了！點此清空所有調課紀錄與額度
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
